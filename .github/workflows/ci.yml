name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ci-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt bandit==1.8.6

      - name: Check v2 source and UTF-8 integrity
        working-directory: .
        shell: pwsh
        run: |
          ./scripts/check-v2-source-integrity.ps1
          ./scripts/check-utf8.ps1

      - name: Check backend quality and security
        run: |
          python -m ruff check app config tests
          python -m mypy --no-site-packages app config
          python -m bandit -q -r app -lll

      - name: Run backend tests and coverage gate
        run: |
          python -m pytest -q \
            -k "not test_scenario_g_coverage_gate" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            --basetemp="${RUNNER_TEMP}/pytest"

      - name: Upload backend coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: ci-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-characters
      DATABASE_URL: sqlite+aiosqlite:////tmp/topicai-e2e.db
      AI_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Run frontend unit tests
        run: pnpm --dir frontend exec vitest run --coverage

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install E2E backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Start E2E backend
        working-directory: backend
        run: |
          nohup python -m uvicorn main:create_app --factory --host 127.0.0.1 --port 8765 \
            > "${RUNNER_TEMP}/topicai-e2e-backend.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/api/v2/health && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/topicai-e2e-backend.log"
          exit 1

      - name: Run frontend E2E suites
        run: pnpm --dir frontend exec playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
