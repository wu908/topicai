# ============================================================
# TopicAI v2-only Docker Compose
# ============================================================
# Usage:
#   cp .env.example .env && edit .env
#   docker compose up -d
#
# Backend: http://localhost:8000 | API docs: http://localhost:8000/docs
# Frontend: http://localhost
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: topicai-backend
    ports:
      # localhost-only: the frontend nginx proxies /api to backend:8000 on the
      # compose network; publishing on 0.0.0.0 would expose the raw API (and
      # /docs) bypassing host firewalls, which Docker rules normally do.
      - "127.0.0.1:8000:8000"
    volumes:
      - topicai_data:/app/data
      - topicai_logs:/app/logs
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/topicai.db
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - LLM_CAPABILITIES=${LLM_CAPABILITIES:-text}
      - AI_ENABLED=${AI_ENABLED:-true}
      - VISION_ENABLED=${VISION_ENABLED:-false}
      # 音视频素材识别（全模态）：默认关。打开需要 OMNI_API_KEY（小米 MiMo
      # 开放平台），模型 id 是 mimo-v2.5（旧名 mimo-v2-omni 已于 2026-06-30 下线）。
      - OMNI_ENABLED=${OMNI_ENABLED:-false}
      - OMNI_BASE_URL=${OMNI_BASE_URL:-https://api.xiaomimimo.com/v1}
      - OMNI_API_KEY=${OMNI_API_KEY:-}
      - OMNI_MODEL=${OMNI_MODEL:-mimo-v2.6-flash}
      # 夜间自动消化的触发时刻（产品时区，默认 03:00）。可在服务器 .env 覆盖，
      # 用于把这条链路指到几分钟后做真实验证。
      - NIGHTLY_DIGEST_HOUR=${NIGHTLY_DIGEST_HOUR:-3}
      - NIGHTLY_DIGEST_MINUTE=${NIGHTLY_DIGEST_MINUTE:-0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # 容器默认是 UTC，而产品承诺「每晚 03:00」整理收件箱（见 scheduler 的
      # PRODUCT_TIMEZONE）。日志与本地时间语义都按产品时区来，否则排查时看到的是
      # 前一天 19:00 的记录，会以为任务没跑。
      - TZ=${TZ:-Asia/Shanghai}
      - SENTRY_DSN=${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - topicai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    container_name: topicai-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - topicai_net

volumes:
  topicai_data:
  topicai_logs:

networks:
  topicai_net:
    driver: bridge
