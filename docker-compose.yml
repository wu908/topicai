# ============================================================
# TopicAI v2-only Docker Compose
# ============================================================
# Usage:
#   cp .env.example .env && edit .env
#   docker compose up -d
#
# Backend: http://localhost:8000 | API docs: http://localhost:8000/docs
# Frontend: http://localhost
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topicai-backend
    ports:
      - "8000:8000"
    volumes:
      - topicai_data:/app/data
      - topicai_logs:/app/logs
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/topicai.db
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - LLM_CAPABILITIES=${LLM_CAPABILITIES:-text}
      - AI_ENABLED=${AI_ENABLED:-true}
      - VISION_ENABLED=${VISION_ENABLED:-false}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SENTRY_DSN=${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - topicai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: topicai-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - topicai_net

volumes:
  topicai_data:
  topicai_logs:

networks:
  topicai_net:
    driver: bridge
