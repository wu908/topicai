<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>内容列表 · 高保真原型（第 1 项）</title>
<style>
  /* ============ Lumen tokens (mirrors frontend/src/styles) ============ */
  :root{
    --ink:#191e26; --body:#454e5c; --muted:#7e8898; --faint:#aeb6c4;
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.72);
    --line:rgba(23,28,38,.08); --line-in:rgba(23,28,38,.055); --line-out:rgba(255,255,255,.8);
    --light:#8fbee8; --light-wash:rgba(143,190,232,.25);
    --shadow:0 22px 60px rgba(70,95,130,.14);
    --radius:22px; --radius-in:15px; --pill:9999px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    --sidebar-w:228px; --proto-h:37px;
    --field:
      radial-gradient(1100px 700px at 78% -12%, #ffffff 0%, rgba(255,255,255,0) 55%),
      radial-gradient(900px 640px at -14% 28%, rgba(160,196,232,.32) 0%, rgba(160,196,232,0) 62%),
      radial-gradient(1000px 720px at 108% 84%, rgba(170,158,226,.16) 0%, transparent 60%),
      linear-gradient(180deg,#f1f4f9 0%,#e7ebf3 100%);
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0; color:var(--body); font:15px/1.7 var(--font);
    background:var(--field); background-attachment:fixed;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  body::before{ /* dot matrix */
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
    background-image:radial-gradient(rgba(23,28,38,.055) 1px, transparent 1px);
    background-size:28px 28px;
  }
  body::after{ /* drifting light orbs, simplified */
    content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(460px 460px at 12% 18%, rgba(255,255,255,.95), rgba(200,222,246,0) 70%),
      radial-gradient(560px 560px at 92% 86%, rgba(173,205,240,.55), rgba(173,205,240,0) 72%),
      radial-gradient(300px 300px at 50% 62%, rgba(255,255,255,.9), rgba(220,232,248,0) 70%);
    filter:blur(20px);
  }
  button,input,textarea{font:inherit}
  button{cursor:pointer}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ============ prototype chrome (outside product) ============ */
  .proto-bar{
    position:relative; z-index:60; display:flex; align-items:center; gap:10px; flex-wrap:nowrap; white-space:nowrap;
    padding:8px 18px; font-size:12px; color:var(--muted);
    background:rgba(255,255,255,.55); backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid var(--line-in);
  }
  .proto-bar b{color:var(--ink);font-weight:600}
  .proto-bar .dot{width:6px;height:6px;border-radius:50%;background:#2e9e5b}
  .proto-bar .spacer{flex:1}
  .proto-bar button{border:1px solid var(--line-out);background:rgba(255,255,255,.6);border-radius:var(--pill);
    padding:4px 12px;font-size:12px;color:var(--body)}
  .proto-bar button:hover{background:#fff;color:var(--ink)}

  /* ============ app shell ============ */
  .app{min-height:100vh;display:flex}
  .sidebar{
    position:fixed; left:14px; top:calc(14px + var(--proto-h)); bottom:14px; width:var(--sidebar-w);
    display:flex; flex-direction:column; padding:18px 12px 14px; z-index:30;
    background:var(--glass); backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--line-out); border-radius:var(--radius);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.85), 0 0 0 1px var(--line-in);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.4px}
  .brand .mark{width:28px;height:28px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;box-shadow:0 10px 24px rgba(25,30,38,.18)}
  nav.nav{display:flex;flex-direction:column;gap:4px}
  .nav a{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;
    color:var(--body);font-size:14px;font-weight:500;text-decoration:none;transition:all .2s cubic-bezier(.32,.72,0,1);
  }
  .nav a:hover{color:var(--ink);background:rgba(255,255,255,.55);transform:translateX(2px)}
  .nav a.active{color:var(--ink);font-weight:650;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 20px rgba(70,95,130,.08)}
  .sb-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line-in);font-size:11.5px;color:var(--faint);line-height:1.55}
  .sb-ai{display:flex;align-items:center;gap:6px;color:var(--muted);margin-bottom:8px}
  .sb-ai i{width:7px;height:7px;border-radius:50%;background:#2e9e5b;box-shadow:0 0 0 3px rgba(46,158,91,.12)}
  .sb-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:var(--faint)}
  .sb-row button{border:0;background:none;color:var(--faint);padding:0;font-size:11.5px}
  .sb-row button:hover{color:var(--ink)}

  .main{
    margin-left:calc(var(--sidebar-w) + 28px); flex:1; min-width:0;
    padding:18px 14px 18px 0; height:calc(100vh - var(--proto-h)); overflow-y:auto;
  }
  .panel{
    min-height:calc(100vh - 36px); display:flex; flex-direction:column;
    background:var(--glass); backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--line-out); border-radius:var(--radius);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.85), 0 0 0 1px var(--line-in);
    overflow:hidden;
  }

  /* ============ page ============ */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:18px 24px 14px;border-bottom:1px solid var(--line-in);flex:0 0 auto;
  }
  .topbar .titleline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .topbar h1{margin:0;font-size:22px;line-height:1.25;font-weight:700;color:var(--ink);letter-spacing:-.2px}
  .topbar .sub{margin:0;font-size:13px;color:var(--muted)}
  .topbar .sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .btn{
    border:1px solid var(--line-out);background:rgba(255,255,255,.6);color:var(--ink);
    border-radius:var(--pill);padding:9px 18px;font-size:13px;font-weight:550;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;white-space:nowrap;
  }
  .btn:hover{background:#fff;transform:translateY(-1px);box-shadow:0 10px 24px rgba(25,30,38,.12)}
  .btn:active{transform:none}
  .btn.primary{background:var(--ink);color:#fff;border-color:transparent;box-shadow:0 10px 26px rgba(25,30,38,.18)}
  .btn.primary:hover{background:#0e131b;box-shadow:0 14px 30px rgba(25,30,38,.24)}
  .btn.sm{padding:6px 14px;font-size:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.ghost{background:rgba(255,255,255,.5)}

  .body{padding:16px 24px 26px;flex:1;min-height:0;display:flex;flex-direction:column}
  .list-band{
    flex:1; min-height:0; display:flex; flex-direction:column;
    background:rgba(255,255,255,.42); border:1px solid var(--line-out); border-radius:var(--radius);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 0 1px var(--line-in);
    padding:14px 18px 16px;
  }
  .band-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .band-head h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line-out);background:rgba(255,255,255,.5);color:var(--body);
    border-radius:var(--pill);padding:5px 12px;font-size:11.5px;font-weight:550;
    transition:all .18s ease; outline:1px solid var(--line-in);
  }
  .chip:hover{background:rgba(255,255,255,.85);color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(25,30,38,.16)}
  .chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
  .search{position:relative;margin:12px 0 4px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
  .search input{
    width:100%;border:1px solid var(--line-out);outline:1px solid var(--line-in);
    background:rgba(255,255,255,.55);border-radius:12px;padding:8px 12px 8px 34px;font-size:13px;color:var(--ink);
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:2px solid rgba(143,190,232,.55);outline-offset:1px;background:#fff}

  .groups{margin-top:6px}
  .group{margin-top:10px}
  .group-head{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line-in);margin-bottom:2px}
  .group-head b{font-size:12px;color:var(--ink);font-weight:650;letter-spacing:.01em}
  .group-head .count{font-size:11px;color:var(--muted);border:1px solid var(--line-out);background:rgba(255,255,255,.55);border-radius:var(--pill);padding:0 7px}
  .group-head .sort{margin-left:auto;font-size:11px;color:var(--faint)}
  .group.collapsed .rows{display:none}
  .group-head .toggle{margin-left:8px;border:0;background:none;color:var(--muted);font-size:11px;padding:2px 4px}
  .group-head .toggle:hover{color:var(--ink)}

  .row{
    display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line-in);
    border-radius:10px;transition:background .18s ease;cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;
  }
  .row:hover,.row:focus-visible{background:rgba(255,255,255,.55);outline:none}
  .row:focus-visible{box-shadow:0 0 0 2px rgba(143,190,232,.55)}
  .step{
    flex:0 0 54px; text-align:center; font-size:11px; color:var(--muted);
    border:1px solid var(--line-out); outline:1px solid var(--line-in);
    background:rgba(255,255,255,.55); border-radius:8px; padding:3px 0; white-space:nowrap;
  }
  .step.draft{color:#4a6fa5;background:rgba(143,190,232,.14);border-color:rgba(143,190,232,.28);outline:0}
  .step.waiting{color:#8a6a3b;background:rgba(138,106,59,.09);border-color:rgba(138,106,59,.2);outline:0}
  .step.done{color:var(--faint)}
  .row-main{flex:1;min-width:0}
  .row-title{font-size:14px;font-weight:650;color:var(--ink);letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-meta{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-meta b{color:var(--body);font-weight:550}
  .row .btn{flex:0 0 auto}
  .row-empty{padding:16px 6px;color:var(--muted);font-size:12.5px;border:1px dashed var(--line-in);border-radius:12px;margin:8px 2px;text-align:center}
  .list-foot{padding:10px 4px 2px;font-size:11.5px;color:var(--faint);display:flex;gap:10px;align-items:center}
  .list-foot .spacer{flex:1}

  /* ============ drawer / modal / toast ============ */
  .backdrop{position:fixed;inset:0;z-index:80;background:rgba(15,20,30,.28);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .22s ease}
  .backdrop.on{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;z-index:90;top:calc(14px + var(--proto-h));right:14px;bottom:14px;visibility:hidden;pointer-events:none;width:min(420px,calc(100vw - 28px));
    display:flex;flex-direction:column;gap:0;
    background:rgba(255,255,255,.82);backdrop-filter:blur(30px) saturate(160%);
    border:1px solid var(--line-out);border-radius:var(--radius);
    box-shadow:0 34px 90px rgba(70,95,130,.28),inset 0 1px 0 #fff;
    transform:translateX(calc(100% + 30px));transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .drawer.on{transform:none;visibility:visible;pointer-events:auto}
  .drawer-h{padding:20px 22px 14px;border-bottom:1px solid var(--line-in)}
  .drawer-h .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .drawer-h h3{margin:0;font-size:19px;line-height:1.35;color:var(--ink);font-weight:700}
  .drawer-b{padding:18px 22px;overflow:auto;flex:1}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-in);font-size:13px}
  .kv span:first-child{color:var(--muted);flex:0 0 74px}
  .kv span:last-child{color:var(--ink);text-align:right}
  .drawer-note{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(143,190,232,.12);border:1px solid rgba(143,190,232,.25);font-size:12px;color:var(--body);line-height:1.6}
  .drawer-f{padding:14px 22px 20px;border-top:1px solid var(--line-in);display:flex;gap:8px;justify-content:flex-end}
  .modal-wrap{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:20px;pointer-events:none;opacity:0;transition:opacity .2s ease}
  .modal-wrap.on{opacity:1;pointer-events:auto}
  .modal{
    width:min(520px,100%);background:rgba(255,255,255,.9);backdrop-filter:blur(30px) saturate(160%);
    border:1px solid var(--line-out);border-radius:24px;box-shadow:0 34px 90px rgba(70,95,130,.28),inset 0 1px 0 #fff;
    padding:22px 24px;transform:translateY(10px) scale(.985);transition:transform .22s ease;
  }
  .modal-wrap.on .modal{transform:none}
  .modal h3{margin:0 0 4px;font-size:19px;color:var(--ink)}
  .modal p{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
  .modal textarea{
    width:100%;min-height:96px;resize:vertical;border:1px solid var(--line-out);outline:1px solid var(--line-in);
    border-radius:14px;padding:10px 12px;font-size:13px;background:rgba(255,255,255,.7);color:var(--ink);
  }
  .modal textarea:focus{outline:2px solid rgba(143,190,232,.55);outline-offset:1px;background:#fff}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);z-index:120;
    background:rgba(25,30,38,.92);color:#fff;border-radius:var(--pill);padding:9px 18px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .24s ease;box-shadow:0 14px 34px rgba(25,30,38,.25);white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .ball{
    position:fixed;right:18px;bottom:18px;z-index:40;width:54px;height:54px;border-radius:50%;
    border:1px solid rgba(255,255,255,.9);background:
      radial-gradient(circle at 30% 28%, #fff, rgba(143,190,232,.55) 48%, rgba(143,190,232,.18) 72%, rgba(255,255,255,.35));
    box-shadow:0 16px 34px rgba(70,95,130,.22),inset 0 1px 0 #fff;transition:transform .2s ease;
  }
  .ball:hover{transform:translateY(-2px) scale(1.03)}
  .ball:focus-visible{outline:2px solid rgba(143,190,232,.7);outline-offset:3px}
  .ai-pop{
    position:fixed;right:18px;bottom:84px;z-index:45;width:300px;padding:16px;
    background:rgba(255,255,255,.84);backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--line-out);border-radius:20px;box-shadow:0 22px 60px rgba(70,95,130,.22),inset 0 1px 0 #fff;
    opacity:0;transform:translateY(8px);pointer-events:none;transition:all .2s ease;
  }
  .ai-pop.on{opacity:1;transform:none;pointer-events:auto}
  .ai-pop h4{margin:0 0 4px;font-size:14px;color:var(--ink)}
  .ai-pop p{margin:0 0 10px;font-size:12px;color:var(--muted)}
  .ai-pop input{width:100%;border:1px solid var(--line-out);outline:1px solid var(--line-in);border-radius:12px;padding:8px 11px;font-size:12.5px;background:#fff}
  .ai-pop .hint{font-size:11px;color:var(--faint);margin-top:8px}

  /* ============ mobile ============ */
  .mobile-nav{display:none}
  @media (max-width: 720px){ .proto-bar{padding:8px 12px;gap:8px;font-size:11px;overflow:hidden} .proto-tip{display:none} }
  @media (max-width: 900px){
    .row .step{flex-basis:50px}
  }
  @media (max-width: 720px){
    .sidebar{display:none}
    .main{margin-left:0;padding:12px 12px 120px;height:auto}
    .panel{min-height:calc(100vh - 24px);border-radius:20px}
    .topbar{padding:14px 16px 12px;align-items:flex-start;gap:10px}
    .topbar h1{font-size:20px}
    .topbar .sub{font-size:12px}
    .body{padding:12px 14px 22px}
    .list-band{padding:12px 12px 14px;border-radius:18px}
    .band-head{flex-direction:column;align-items:flex-start;gap:8px}
    .filters{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:4px;gap:6px;scrollbar-width:none}
    .filters::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto}
    .search{margin-top:10px}
    .row{gap:9px;padding:11px 2px;align-items:flex-start}
    .step{flex-basis:46px;font-size:10.5px;padding:2px 0;margin-top:2px}
    .row-title{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
    .row-meta{white-space:normal;font-size:11.5px;line-height:1.5}
    .row .btn{padding:7px 12px;min-height:38px;font-size:12px;align-self:center}
    .group-head .sort{display:none}
    .ball{display:none}
    .mobile-nav{
      position:fixed;left:10px;right:10px;bottom:10px;z-index:40;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
      padding:8px 6px;background:rgba(255,255,255,.7);backdrop-filter:blur(24px) saturate(160%);
      border:1px solid var(--line-out);border-radius:20px;box-shadow:0 18px 44px rgba(70,95,130,.16);
    }
    .mobile-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      padding:7px 2px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:11px}
    .mobile-nav a.active{color:var(--ink);background:rgba(255,255,255,.8);font-weight:650}
    .drawer{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-height:82vh;border-radius:22px;transform:translateY(calc(100% + 30px));visibility:hidden;pointer-events:none}
    .drawer.on{transform:none;visibility:visible;pointer-events:auto}
    .toast{bottom:96px;max-width:calc(100vw - 32px);white-space:normal;text-align:center}
  }
</style>
</head>
<body>
<!-- prototype chrome -->
<div class="proto-bar">
  <span class="dot"></span><b>高保真原型</b> · 内容列表（第 1 项）
  <span class="spacer"></span>
  <span class="proto-tip">可试：筛选 / 搜索 / 折叠 / 开始一条 / 点击任意行</span>
  <button id="reset" type="button">重置示例</button>
</div>

<div class="app">
  <!-- ============ sidebar ============ -->
  <aside class="sidebar" aria-label="侧栏">
    <div class="brand"><span class="mark">T</span><span>TopicAI</span></div>
    <nav class="nav" aria-label="主导航">
      <a href="#" data-nav>今日</a>
      <a href="#" data-nav class="active" aria-current="page">内容</a>
      <a href="#" data-nav>周复盘</a>
      <a href="#" data-nav>成长</a>
      <a href="#" data-nav>路径</a>
      <a href="#" data-nav>素材</a>
      <a href="#" data-nav>我的</a>
      <a href="#" data-nav>设置</a>
    </nav>
    <div class="sb-foot">
      <div class="sb-ai"><i></i>AI 已连接 · deepseek-v4-flash-vision-exp</div>
      <div>你只负责输入和拍板；其余交给 AI 跑腿</div>
      <div class="sb-row"><span>测试小新</span><span><button type="button" data-toast="资料页（原型未展开）">资料</button>　<button type="button" data-toast="退出（原型不生效）">退出</button></span></div>
    </div>
  </aside>

  <!-- ============ main ============ -->
  <main class="main">
    <div class="panel">
      <header class="topbar">
        <div class="titleline">
          <h1>内容</h1>
          <p class="sub" id="stats">共 <b>6</b> 条 · <b>3</b> 条待你推进</p>
        </div>
        <button class="btn primary" id="createBtn" type="button">开始一条</button>
      </header>

      <div class="body">
        <div class="list-band">
          <div class="band-head">
            <h2>全部内容</h2>
            <div class="filters" role="group" aria-label="筛选内容">
              <button class="chip on" type="button" data-filter="all" aria-pressed="true">全部 <span class="n" data-count="all">6</span></button>
              <button class="chip" type="button" data-filter="draft" aria-pressed="false">想发的 <span class="n" data-count="draft">3</span></button>
              <button class="chip" type="button" data-filter="observing" aria-pressed="false">等复盘的 <span class="n" data-count="observing">2</span></button>
              <button class="chip" type="button" data-filter="done" aria-pressed="false">已沉淀 <span class="n" data-count="done">1</span></button>
            </div>
          </div>

          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="搜索标题、形态或下一步" aria-label="搜索标题、形态或下一步" />
          </div>

          <div class="groups" id="groups" aria-live="polite"></div>

          <div class="list-foot">
            <span id="foot">共 6 条 · 搜索标题或形态</span>
            <span class="spacer"></span>
            <span>按更新时间排序</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- floating AI -->
<button class="ball" id="ball" type="button" aria-label="打开全局 AI" data-toast="全局 AI 面板（原型暂不展开）"></button>

<!-- drawer -->
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-h">
    <div class="kicker">项目</div>
    <h3 id="drawerTitle">—</h3>
  </div>
  <div class="drawer-b" id="drawerBody"></div>
  <div class="drawer-f">
    <button class="btn ghost sm" type="button" id="drawerClose">返回列表</button>
    <button class="btn primary sm" type="button" id="drawerGo">进入项目</button>
  </div>
</aside>

<!-- create modal -->
<div class="modal-wrap" id="modalWrap" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h3 id="modalTitle">开始一条内容</h3>
    <p>说一句就够了，不用先想清楚。AI 会先理解你想做什么，再问你一个最要紧的问题。</p>
    <textarea id="createInput" placeholder="一句话说说你想做什么，例如：我想做一期租房小空间收纳…" aria-label="一句话说说你想做什么"></textarea>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="createCancel">取消</button>
      <button class="btn primary" type="button" id="createSubmit" disabled>开始</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- mobile nav -->
<nav class="mobile-nav" aria-label="移动端导航">
  <a href="#" data-nav>今日</a>
  <a href="#" data-nav class="active" aria-current="page">内容</a>
  <a href="#" data-nav>周复盘</a>
  <a href="#" data-nav>我的</a>
  <a href="#" data-nav data-toast="更多（原型未展开）">更多</a>
</nav>

<script>
(function(){
  "use strict";
  var initial = [
    { id:"p1", group:"draft", step:"定方向", title:"租房小空间收纳的 3 个坑", next:"先补一个真实细节", time:"今天 20:21", action:"继续", actionKind:"primary", form:"图文" },
    { id:"p2", group:"draft", step:"写初稿", title:"下班后 10 分钟整理书桌", next:"先写下真实经历", time:"昨天", action:"继续", actionKind:"primary", form:"视频" },
    { id:"p3", group:"draft", step:"去发布", title:"第一篇：我为什么开始做自媒体", next:"记录已经发布", time:"3 天前", action:"去发布", actionKind:"ghost", form:"图文" },
    { id:"p4", group:"observing", step:"等数据", title:"收纳工具踩坑合集", next:"回填实际表现", time:"2 天前", action:"回填数据", actionKind:"ghost", form:"图文" },
    { id:"p5", group:"observing", step:"可复盘", title:"第一次周末复盘", next:"对照发布结果", time:"前天", action:"去复盘", actionKind:"ghost", form:"图文" },
    { id:"p6", group:"done", step:"已沉淀", title:"第一次复盘", next:"写进公式或结束", time:"10 月 12 日", action:"查看", actionKind:"ghost", form:"图文" }
  ];
  var groups = [
    { id:"draft", label:"想发的", sort:"按更新时间排序" },
    { id:"observing", label:"等复盘的", sort:"" },
    { id:"done", label:"已沉淀", sort:"" }
  ];
  var state = { projects: initial.slice(), filter:"all", query:"", collapsed:{ done:true }, lastFocus:null };

  var $ = function(id){ return document.getElementById(id); };
  var groupsEl = $("groups"), statsEl = $("stats"), footEl = $("foot"), searchEl = $("search");
  var drawer = $("drawer"), drawerTitle = $("drawerTitle"), drawerBody = $("drawerBody"), backdrop = $("backdrop");
  var modalWrap = $("modalWrap"), createInput = $("createInput"), createSubmit = $("createSubmit");
  var toastEl = $("toast"), toastTimer = null;

  function toast(text){
    toastEl.textContent = text; toastEl.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, 1800);
  }
  function counts(){
    return {
      all: state.projects.length,
      draft: state.projects.filter(function(p){ return p.group==="draft"; }).length,
      observing: state.projects.filter(function(p){ return p.group==="observing"; }).length,
      done: state.projects.filter(function(p){ return p.group==="done"; }).length
    };
  }
  function visible(){
    var q = state.query.trim().toLowerCase();
    return state.projects.filter(function(p){
      if (state.filter !== "all" && p.group !== state.filter) return false;
      if (!q) return true;
      return (p.title+" "+p.form+" "+p.next+" "+p.step).toLowerCase().indexOf(q) >= 0;
    });
  }
  function el(tag, cls, text){
    var n = document.createElement(tag); if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text; return n;
  }
  function render(){
    var c = counts();
    statsEl.innerHTML = "共 <b>"+c.all+"</b> 条 · <b>"+c.draft+"</b> 条待你推进";
    Object.keys(c).forEach(function(k){
      var node = document.querySelector('[data-count="'+k+'"]'); if (node) node.textContent = c[k];
    });
    var items = visible();
    groupsEl.innerHTML = "";
    if (!items.length){
      var empty = el("div","row-empty", state.query ? ("没有匹配「"+state.query+"」的内容。清除搜索试试。") : "这个视图下还没有内容。");
      groupsEl.appendChild(empty);
      footEl.textContent = "共 0 条";
      bindEmpty();
      return;
    }
    groups.forEach(function(g){
      if (state.filter !== "all" && state.filter !== g.id) return;
      var rows = items.filter(function(p){ return p.group === g.id; });
      var groupEl = el("section","group");
      if (state.filter === "all" && state.collapsed[g.id]) groupEl.classList.add("collapsed");
      var head = el("div","group-head");
      head.appendChild(el("b",null,g.label));
      head.appendChild(el("span","count",String(rows.length)));
      if (g.sort) head.appendChild(el("span","sort",g.sort));
      if (state.filter === "all" && (g.id === "done" || g.id === "observing" && rows.length > 5)){
        var t = el("button","toggle", state.collapsed[g.id] ? "展开" : "收起");
        t.type = "button";
        t.setAttribute("aria-expanded", String(!state.collapsed[g.id]));
        t.addEventListener("click", function(e){
          e.stopPropagation(); state.collapsed[g.id] = !state.collapsed[g.id]; render();
        });
        head.appendChild(t);
      }
      groupEl.appendChild(head);
      var rowsEl = el("div","rows");
      if (!rows.length){
        var hint = g.id === "draft" ? "先去「想发的」看看，或开始一条。" : "这一组暂时没有内容。";
        var emptyRow = el("div","row-empty", hint);
        if (g.id !== "draft") {
          var go = el("button","btn ghost sm","去「想发的」看看");
          go.type = "button"; go.addEventListener("click", function(){ setFilter("draft"); });
          emptyRow.appendChild(document.createElement("br")); emptyRow.appendChild(go);
        }
        rowsEl.appendChild(emptyRow);
      }
      rows.forEach(function(p){
        var row = document.createElement("div");
        row.className = "row"; row.setAttribute("role","button"); row.setAttribute("tabindex","0");
        row.setAttribute("aria-label", p.title + "，" + p.step + "，下一步：" + p.next);
        var step = el("span","step "+p.group,p.step);
        var main = el("div","row-main");
        main.appendChild(el("div","row-title",p.title));
        var meta = el("div","row-meta");
        meta.appendChild(el("b",null,"下一步："+p.next));
        meta.appendChild(document.createTextNode(" · "+p.time));
        main.appendChild(meta);
        var btn = el("button","btn "+p.actionKind+" sm", p.action);
        btn.type = "button";
        btn.addEventListener("click", function(e){ e.stopPropagation(); openDrawer(p); });
        row.appendChild(step); row.appendChild(main); row.appendChild(btn);
        row.addEventListener("click", function(){ openDrawer(p); });
        row.addEventListener("keydown", function(e){
          if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openDrawer(p); }
        });
        rowsEl.appendChild(row);
      });
      groupEl.appendChild(rowsEl);
      groupsEl.appendChild(groupEl);
    });
    footEl.textContent = "共 "+items.length+" 条" + (state.query ? " · 搜索「"+state.query+"」" : " · 搜索标题或形态");
  }
  function bindEmpty(){
    var btn = groupsEl.querySelector(".row-empty .btn");
    if (btn) return;
  }
  function setFilter(f){
    state.filter = f;
    document.querySelectorAll("[data-filter]").forEach(function(b){
      var on = b.getAttribute("data-filter") === f;
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
    });
    render();
  }
  function openDrawer(p){
    state.lastFocus = document.activeElement;
    drawerTitle.textContent = p.title;
    drawerBody.innerHTML = "";
    [["当前步骤",p.step],["下一步",p.next],["形态",p.form],["最近活动",p.time]].forEach(function(kv){
      var row = el("div","kv"); row.appendChild(el("span",null,kv[0])); row.appendChild(el("span",null,kv[1])); drawerBody.appendChild(row);
    });
    var note = el("div","drawer-note","这是高保真原型里的项目入口示例。项目屏（对话 / 稿 / 发布包 / bet 对账）会在第 3 项单独出高保真，这里先验证列表的层级与跳转手感。");
    drawerBody.appendChild(note);
    drawer.classList.add("on"); backdrop.classList.add("on");
    setTimeout(function(){ $("drawerClose").focus(); }, 50);
  }
  function closeDrawer(){
    drawer.classList.remove("on"); backdrop.classList.remove("on");
    if (state.lastFocus && state.lastFocus.focus) state.lastFocus.focus();
  }
  function openModal(){
    modalWrap.classList.add("on"); backdrop.classList.add("on");
    createInput.value = ""; createSubmit.disabled = true;
    setTimeout(function(){ createInput.focus(); }, 40);
  }
  function closeModal(){
    modalWrap.classList.remove("on");
    if (!drawer.classList.contains("on")) backdrop.classList.remove("on");
  }
  function addProject(){
    var text = createInput.value.trim(); if (!text) return;
    state.projects.unshift({
      id:"new-"+Date.now(), group:"draft", step:"定方向",
      title:text.slice(0,40), next:"先补一个真实细节", time:"刚刚", action:"继续", actionKind:"primary", form:"图文"
    });
    state.filter = "all"; state.query = ""; searchEl.value = "";
    document.querySelectorAll("[data-filter]").forEach(function(b){
      var on = b.getAttribute("data-filter") === "all";
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
    });
    closeModal(); render(); toast("已创建示例内容：AI 会先问你一个最要紧的问题");
  }

  // events
  document.querySelectorAll("[data-filter]").forEach(function(b){
    b.addEventListener("click", function(){ setFilter(b.getAttribute("data-filter")); });
  });
  searchEl.addEventListener("input", function(){ state.query = searchEl.value; render(); });
  $("createBtn").addEventListener("click", openModal);
  $("createCancel").addEventListener("click", closeModal);
  createInput.addEventListener("input", function(){ createSubmit.disabled = !createInput.value.trim(); });
  createInput.addEventListener("keydown", function(e){ if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) addProject(); });
  createSubmit.addEventListener("click", addProject);
  $("drawerClose").addEventListener("click", closeDrawer);
  $("drawerGo").addEventListener("click", function(){ closeDrawer(); toast("进入项目屏（第 3 项单独出高保真）"); });
  backdrop.addEventListener("click", function(){ closeDrawer(); closeModal(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ closeDrawer(); closeModal(); }
  });
  $("reset").addEventListener("click", function(){
    state.projects = initial.slice(); state.filter = "all"; state.query = ""; state.collapsed = { done:true }; searchEl.value = "";
    document.querySelectorAll("[data-filter]").forEach(function(b){
      var on = b.getAttribute("data-filter") === "all";
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
    });
    closeDrawer(); closeModal(); render(); toast("已恢复示例数据");
  });
  document.querySelectorAll("[data-toast]").forEach(function(b){
    if (b.hasAttribute("data-nav")) {
      b.addEventListener("click", function(e){ e.preventDefault(); toast(b.getAttribute("data-toast") || (b.textContent+"（原型未展开）")); });
    } else {
      b.addEventListener("click", function(){ toast(b.getAttribute("data-toast")); });
    }
  });
  render();
})();
</script>
</body>
</html>
