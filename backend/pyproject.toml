[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topicai"
version = "5.0.0"
description = "TopicAI content-project workspace"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "TopicAI Team"}
]
keywords = ["ai", "content-creation", "topic-recommendation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "aiosqlite==0.22.1",
    "openai==1.58.1",
    "httpx==0.28.1",
    "passlib[bcrypt]==1.7.4",
    # Mirror requirements.txt: PyJWT is imported by app/core/auth.py; bcrypt 4.1+
    # removes __about__.__version__ which passlib 1.7.4 reads at runtime.
    "pyjwt==2.13.0",
    "bcrypt==4.0.1",
    "email-validator==2.3.0",
    "apscheduler==3.11.3",
    "sentry-sdk==2.68.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.15.1",
    "ruff==0.16.5",
    "mypy==1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# SQLAlchemy Row / Result type inference is incomplete; these are noise on working code.
# Phase 1 cleanup: also silence fastapi-dependency narrowing and legacy chain signatures.
# Real type bugs caught in PR review (e.g. mismatched Pydantic model fields) are still reported
# via mypy's other error codes (typed-call, return-value, etc.).
disable_error_code = [
    "no-any-return",
    "attr-defined",
    "index",
    "union-attr",
    "assignment",
    "valid-type",
    "var-annotated",
    "no-redef",
    "arg-type",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 显式声明 fixture 循环作用域，消除 pytest-asyncio 的 PytestDeprecationWarning
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # passlib 1.7.4 在 import 层使用 stdlib crypt（Python 3.13 移除）；
    # 上游未发修复版前窄化忽略，避免 CI 噪音。见 requirements pin。
    "ignore:'crypt' is deprecated:DeprecationWarning:passlib",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["app", "config"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# Constitution Principle II / Quality Gate 7: coverage floor 80%
# Baseline at 2026-06-07: 69.10% (RED — implementation phases US1-US6 must raise).
fail_under = 80
