server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — redirect all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it references content-hashed chunks,
    # and a stale copy after a redeploy points at deleted assets — the app
    # then dies on a dynamic-import failure with a blank error screen
    # (observed 2026-09-13 on the deployed instance right after a rebuild).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        # AI 消化单条需要几十秒（模型生成），默认 60s 读超时会把请求切断。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file caching (content-hashed filenames — safe to cache long)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
